[project]
name = "semif-systemone-service"
version = "0.1.0"
description = "Explicit Jev choice-to-SemIf adapter and loopback HTTP service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Source is revision-pinned; model checkpoints remain runtime downloads in HF_HOME.
model = [
  "semif-phase1 @ git+https://github.com/TheoLeeCJ/SemIf.git@1f2dea3e25379f9dfc98cb83c324f00ab5deda37",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
semif-systemone = "semif_service.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
