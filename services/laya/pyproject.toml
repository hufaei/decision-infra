[project]
name = "laya-systemone-service"
version = "0.1.0"
description = "Pinned Laya Multilingual System One service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
model = [
  "laya==0.3.5",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
laya-systemone = "laya_service.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
